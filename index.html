<body>
<div id="app">
<div id="map"></div>
<div class="marker-placement-mask" aria-hidden="true"></div>

<div class="topbar">

<script>
/* Google Maps version v45 */
const API_URL='https://script.google.com/macros/s/AKfycbyeVm_S8Pa5j1rucZ4-GI2GnOLbsYeBpKWOkbOTToTvHQ0Hkw92jtM7z0hUioJeC59v/exec';
const GOOGLE_MAPS_BROWSER_KEY='YOUR_GOOGLE_MAPS_BROWSER_KEY';

function api(action, params={}){
 return new Promise((resolve,reject)=>{
  const cb='jsonp_'+Date.now()+'_'+Math.random().toString(36).slice(2);
  const script=document.createElement('script');
  const q=new URLSearchParams({...params,action,callback:cb,_:Date.now()});
  let done=false;
  const cleanup=()=>{if(done)return;done=true;try{delete window[cb]}catch(e){}script.remove()};
  const timer=setTimeout(()=>{cleanup();reject(new Error('サーバー応答がタイムアウトしました。'))},15000);
  window[cb]=(payload)=>{clearTimeout(timer);cleanup();if(payload&&payload.ok===false)reject(new Error(payload.error||'APIエラー'));else resolve(payload?payload.data:null)};
  script.onerror=()=>{clearTimeout(timer);cleanup();reject(new Error('APIに接続できませんでした。'))};
  script.src=API_URL+'?'+q.toString();
  document.head.appendChild(script);
 });
}

let map=null,fireMarker=null,fireCircle=null,selectedWater=null,selectedMarker=null;
let waterMarkers={},overlayMarkers={},waterData=[],jurisdictionData=[],jurisdictionLayers=[];
let tempRoad=[],tempLine=null,addingMode=null,incident=null,routeLayer=null,lastRouteMeters=0,syncTimer=null,syncBusy=false,markerSyncBusy=false;
let historyViewMode=false;
const defaultCenter={lat:35.5572,lng:139.7330};
const $=id=>document.getElementById(id);
function showIncidentBadge(){}
function hideIncidentBadge(){}


function showToast(msg){const el=$('toast');el.textContent=msg;el.style.display='block';clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>el.style.display='none',1800)}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function closeAllSheets(){document.querySelectorAll('.sheet').forEach(x=>x.classList.add('hidden'))}
function closeSheet(id){$(id).classList.add('hidden');if(id==='drawSheet')cancelMarkerMode();if(id==='waterSheet'&&lastRouteMeters){$('routeSummary').textContent='📏 ホース敷設距離 '+lastRouteMeters+'m';$('routeSummary').classList.remove('hidden')}}
function openManageMenu(){closeAllSheets();$('manageSheet').classList.remove('hidden')}

async function refreshFromManage(){
  if(!incident){showToast('現在の現場がありません');return}
  closeSheet('manageSheet');
  showToast('最新情報を取得中…');
  try{
    await loadAll(false);
    showToast('✓ 最新情報を取得しました');
  }catch(e){
    alert(e.message||e);
  }
}

function formatIncidentDate(value){
  const d=new Date(value);
  if(isNaN(d.getTime()))return String(value||'日時不明');
  return new Intl.DateTimeFormat('ja-JP',{
    year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit',hour12:false
  }).format(d);
}

async function openHistory(){
  closeAllSheets();
  $('historySheet').classList.remove('hidden');
  $('historyList').innerHTML='<div class="history-empty">履歴を読み込み中…</div>';
  $('historyCount').textContent='';
  try{
    const rows=await api('getIncidentHistory');
    renderHistory(rows||[]);
  }catch(e){
    $('historyList').innerHTML='<div class="history-empty">履歴を読み込めませんでした。</div>';
    alert(e.message||e);
  }
}

function renderHistory(rows){

function onMapClick(e){
 if(!addingMode)return;
 const lat=e.latLng.lat(),lng=e.latLng.lng();

 // 消防車・積載車
 // 仮マーカーを先に表示し、保存完了後も「同じマーカー」をそのまま使う。
 // これで保存時の「一瞬消える→再表示」を防ぐ。
 if(addingMode==='truck'||addingMode==='loader'){
  const mode=addingMode,name=mode==='loader'?'積載車':'消防車';
  addingMode=null;
  $('markerMode').style.display='none';
  setPlacementMode(false);

  const tempId='TEMP_'+Date.now();
  const temp={markerId:tempId,type:mode,name,lat,lng,status:''};
  addIncidentMarker(temp);

  api('addMarker',{type:mode,name,lat,lng,status:''}).then(m=>{
   if(m){
    const marker=overlayMarkers[tempId];

    if(marker){
     // 既存の表示中マーカーをサーバー保存後のIDへ引き継ぐ。
     // setMap(null) をしないので画面上で消えない。
     try{google.maps.event.clearListeners(marker,'click')}catch(e){}
     marker.setTitle(m.name||name);
     marker.setClickable(true);
     marker.addListener('click',()=>showMarkerInfo(m));

     delete overlayMarkers[tempId];
     overlayMarkers[m.markerId]=marker;
    }else{
     addIncidentMarker(m);
    }

    showToast(name+'を登録しました');
   }else{
    showToast('保存できませんでした');
   }
  }).catch(err=>{
   // 保存失敗時は仮マーカーを残さず、エラーを知らせる。
   if(overlayMarkers[tempId]){
    overlayMarkers[tempId].setMap(null);
    delete overlayMarkers[tempId];
   }
   alert('マーカーを保存できませんでした。\n'+(err.message||err));
  });
  return;
 }

 // 通行止め
 if(addingMode==='road'){
  tempRoad.push({lat,lng});
  if(tempLine)tempLine.setMap(null);
  tempLine=new google.maps.Polyline({
   map,
   path:tempRoad,
   strokeColor:'#ff3b30',
   strokeWeight:10,
   strokeOpacity:.95,
   clickable:false,
   zIndex:900
  });
 }
}
async function finishRoad(){
 if(tempRoad.length<2){alert('道路に沿って2点以上タップしてください。');return}

 // 登録中も描画した赤線を地図から消さない。
 // 保存完了後は「同じ線」を正式マーカーとして引き継ぐ。
 const path=tempRoad.slice();
 const c=path[Math.floor(path.length/2)];
 const oldLine=tempLine;

 addingMode=null;
 $('markerMode').style.display='none';
 $('drawSheet').classList.add('hidden');
 setPlacementMode(false);

 try{
  const m=await api('addMarker',{
   type:'road',
   name:'通行止め区間',
   lat:c.lat,
   lng:c.lng,
   status:JSON.stringify(path)
  });

  if(m && oldLine){
   // 仮線を消さず、そのまま正式な通行止めマーカーへ昇格。
   let savedPath=path;
   try{
    const p=JSON.parse(m.status||m.geometry||'[]');
    if(p.length>=2){
     savedPath=p.map(x=>({lat:Number(x.lat??x[0]),lng:Number(x.lng??x[1])}));
    }
   }catch(e){}

   oldLine.setPath(savedPath);
   oldLine.setOptions({clickable:true,zIndex:900});

   try{google.maps.event.clearListeners(oldLine,'click')}catch(e){}
   oldLine.addListener('click',()=>showMarkerInfo(m));

   delete overlayMarkers['TEMP_ROAD'];
   overlayMarkers[m.markerId]=oldLine;
   tempLine=null;
   tempRoad=[];
   showToast('通行止めを登録しました');
  }else if(m){
   addIncidentMarker(m);
   tempLine=null;
   tempRoad=[];
   showToast('通行止めを登録しました');
  }else{
   // 保存失敗時は仮線を残して、場所を確認できるようにする。
   showToast('通行止めを保存できませんでした');
  }
 }catch(e){
  // エラー時も仮線を消さない。
  alert('通行止めを保存できませんでした。\n'+(e.message||e));
 }
}
function cancelDraw(){cancelMarkerMode()}
function addIncidentMarker(m){
 if(!m||!m.markerId)return;
 if(overlayMarkers[m.markerId]){overlayMarkers[m.markerId].setMap(null);delete overlayMarkers[m.markerId]}
 if(m.type==='road'){
  let p=[];try{p=JSON.parse(m.status||m.geometry||'[]')}catch(e){}
  if(p.length<2)return;
  const path=p.map(x=>({lat:Number(x.lat??x[0]),lng:Number(x.lng??x[1])}));
  // 通行止め線は「選択モード中」はクリックで邪魔をしない。
  // 通常時だけ選択できるようにする。
  const line=new google.maps.Polyline({
   map,
   path,
   strokeColor:'#ff3b30',
   strokeWeight:12,
   strokeOpacity:.95,
   clickable:!addingMode,
   zIndex:900
  });
  line.addListener('click',()=>{
   if(!addingMode)showMarkerInfo(m);
  });
  overlayMarkers[m.markerId]=line;
 }else{
  // 車両はGoogle Maps標準ピンを使わず、色付き円＋車両アイコンで表示。
  // 消火栓・防火水槽にはこの処理は適用しない。
  const isLoader = m.type==='loader' || m.type==='積載車';
  const isFire = m.type==='fire' || m.type==='消防車';
  const emoji = isLoader ? '🚚' : '🚒';
  const bg = isLoader ? '#1976d2' : '#d71919';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="58" height="58" viewBox="0 0 58 58">
    <circle cx="29" cy="29" r="26" fill="${bg}" stroke="#fff" stroke-width="3"/>
    <text x="29" y="38" text-anchor="middle" font-size="29">${emoji}</text>
  </svg>`;
  const marker=new google.maps.Marker({
    map,
    position:{lat:Number(m.lat),lng:Number(m.lng)},
    title:m.name||emoji,
    icon:{
      url:'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg),
      scaledSize:new google.maps.Size(58,58),
      anchor:new google.maps.Point(29,29)
    }
  });
  marker.setClickable(!addingMode);
  marker.addListener('click',()=>{if(!addingMode)showMarkerInfo(m)});
  overlayMarkers[m.markerId]=marker;
 }
}

  try{
    const result=await api('deleteMarker',{markerId});
    if(result!==true)throw new Error('サーバー側でマーカーを削除できませんでした。');
    // サーバー保存が成功したら、画面上のマーカーも即時に消す。
    // 直後に全体再取得すると古いスナップショットで一瞬復活することがあるため、
    // 削除時はloadAll()を呼ばず、対象だけローカルから除去する。
    const marker=overlayMarkers[markerId];
    if(marker){
      try{marker.setMap(null)}catch(e){}
      delete overlayMarkers[markerId];
    }
    selectedMarker=null;
    closeSheet('markerSheet');
    showToast('削除しました');
  }catch(e){
    alert(e.message||e);
  }
}

async function calculateRouteToWater(w){
 clearRoute();
 const box=$('routeInfo');
 if(!incident){box.textContent='📏 火災現場がありません';return}
 box.dataset.routeMeters='';box.innerHTML='📏 ホース敷設距離を計算中…';
 try{
  const {Route}=await google.maps.importLibrary('routes');
  const request={origin:{lat:Number(incident.lat),lng:Number(incident.lng)},destination:{lat:Number(w.lat),lng:Number(w.lng)},travelMode:'WALKING',fields:['distanceMeters','path','warnings'],computeAlternativeRoutes:false};
  const result=await Route.computeRoutes(request);
  const route=result?.routes?.[0];
  if(!route||!route.distanceMeters)throw new Error('ルートが取得できませんでした');
  routeLayer=route.createPolylines();
  routeLayer.forEach(line=>line.setMap(map));
  const meters=Math.round(route.distanceMeters);
  box.dataset.routeMeters=meters; lastRouteMeters=meters;
  renderRouteInfo(meters,false,route.warnings||[]); $('routeSummary').textContent='📏 ホース敷設距離 '+meters+'m'; $('routeSummary').classList.remove('hidden');
 }catch(e){
  console.error('Route compute failed',e);
  box.dataset.routeMeters='';
  box.innerHTML='📏 <b>ホース敷設距離を取得できませんでした</b><br><span style="font-weight:600">直線 '+w.distance+'m を参考表示しています。</span>';
 }
}
function renderRouteInfo(meters,fallback,warnings=[]){const hose=20,count=Math.ceil(meters/hose),extra=Math.max(1,count+1);$('routeInfo').innerHTML='📏 ホース敷設距離<div class="route-main">'+meters+'m</div><div>🧯 '+hose+'mホース：<b>最低 '+count+'本</b> ／ 余裕をみて <b>'+extra+'本程度</b></div><div class="route-note">※徒歩ルートを基準にした敷設目安。実際は現場の通行状況を優先。</div>'+(warnings.length?'<div class="route-note">※Googleの徒歩ルートに注意事項があります。</div>':'')+(fallback?'<div>※参考値</div>':'')}
function recalcHose(){const meters=Number($('routeInfo').dataset.routeMeters||0);if(meters)renderRouteInfo(meters,false)}

function confirmEndIncident(){closeSheet('manageSheet');setTimeout(endIncident,50)}
async function endIncident(){if(!confirm('今回の現場を終了します。現場の履歴は残ります。\n本当に終了しますか？'))return;stopSharedPolling();try{await api('endIncident');incident=null;selectedWater=null;selectedMarker=null;waterData=[];clearRoute();if(fireMarker)fireMarker.setMap(null);if(fireCircle)fireCircle.setMap(null);fireMarker=null;fireCircle=null;clearOverlays();hideIncidentBadge();$('headerSub').textContent='管轄：南蒲田3丁目・西糀谷1〜4丁目・北糀谷 ／ 周辺200mもカバー';$('stats').classList.add('hidden');$('address').value='';showHome();showToast('現場を終了しました')}catch(e){alert(e.message||e)}}

loadGoogleMaps();
